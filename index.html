<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#09111e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="VidCreator">
<title>VidCreator</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=JetBrains+Mono:wght@500&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Sora:wght@600;700;800&display=swap">
<style>
/* Layout: one phone-width column, sticky header + scrollable tab strip, cards only where they set something apart */
:root{
  --bg:#09111e; --surface:#101b2c; --surface-2:#16243a; --line:#213350;
  --fg:#e9eff8; --muted:#8b9bb4; --accent:#3ee6a0; --accent-ink:#04261a;
  --blue:#4c8dff; --violet:#8f72ff; --rec:#ff4d5e;
  --ok:#3ee6a0; --warn:#ffc24a; --bad:#ff6b6b;
  --f-display:"Sora","Segoe UI",system-ui,sans-serif;
  --f-body:"Plus Jakarta Sans","Segoe UI",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --r:16px;
  color-scheme:dark;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  -webkit-text-size-adjust:100%;
}
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]){
  --bg:#f2f5fa; --surface:#ffffff; --surface-2:#e9eff7; --line:#d4deeb;
  --fg:#0d1828; --muted:#58698a; --accent:#0d9f64; --accent-ink:#ffffff;
  --blue:#2c69d8; --violet:#6a4fdc; --rec:#d92f40; --ok:#0d9f64; --warn:#b57708; --bad:#d23b3b; color-scheme:light } }
:root[data-theme="light"]{
  --bg:#f2f5fa; --surface:#ffffff; --surface-2:#e9eff7; --line:#d4deeb;
  --fg:#0d1828; --muted:#58698a; --accent:#0d9f64; --accent-ink:#ffffff;
  --blue:#2c69d8; --violet:#6a4fdc; --rec:#d92f40; --ok:#0d9f64; --warn:#b57708; --bad:#d23b3b; color-scheme:light }

*{box-sizing:border-box}
[hidden]{display:none!important}
img{max-width:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
#app{max-width:560px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15}
p{margin:0}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:12px}
.muted{color:var(--muted)}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:10px;padding-block:14px 10px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:800;font-size:20px;letter-spacing:-.01em}
.brand b{color:var(--accent)}
.logo{width:34px;height:34px;flex:none}
.sync{margin-left:auto;font-size:12px;color:var(--muted);white-space:nowrap}
.icon{width:40px;height:40px;flex:none;display:grid;place-items:center;border-radius:12px;border:1px solid var(--line);background:var(--surface)}
.icon svg{width:20px;height:20px}
.pname{flex:1;min-width:0;background:transparent;border:1px solid transparent;border-radius:10px;padding:8px 10px;font-family:var(--f-display);font-weight:700;font-size:17px}
.pname:hover,.pname:focus{border-color:var(--line);background:var(--surface);outline:none}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:14px;padding:12px 16px;font-weight:700;border:1px solid var(--line);background:var(--surface);text-decoration:none;color:var(--fg);min-height:46px}
.btn svg{width:18px;height:18px;flex:none}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{background:transparent}
.btn.sm{min-height:36px;padding:7px 12px;font-size:13px;border-radius:11px}
.btn.big{width:100%;min-height:54px;font-size:16px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.actions{display:flex;flex-wrap:wrap;gap:10px}
.actions .btn{flex:1 1 auto}

.hello{display:grid;gap:14px;padding-block:18px 26px}
.hello h1{font-size:clamp(30px,8vw,40px);font-weight:800;letter-spacing:-.02em}
.hello h1 span{color:var(--accent)}
.hello p{color:var(--muted);max-width:44ch}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;margin-block:6px 12px}
.sec-h h2{font-size:18px}
.plist{display:grid;gap:10px}
.pcard{display:grid;gap:8px;text-align:left;width:100%;padding:14px 16px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface)}
.pcard:hover{border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
.pc-top{display:flex;gap:8px;align-items:center;min-width:0}
.pc-name{font-weight:700;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pc-meta{font-size:13px;color:var(--muted)}
.pc-foot{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.lvl{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;white-space:nowrap}
.lvl::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.lvl-ok{color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,transparent)}
.lvl-warn{color:var(--warn);background:color-mix(in srgb,var(--warn) 15%,transparent)}
.lvl-bad{color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,transparent)}
.lvl-none{color:var(--muted);background:var(--surface-2)}
.legend{margin-top:22px;display:grid;gap:10px;padding:16px;border-radius:var(--r);background:var(--surface-2)}
.legend h3{font-size:15px}
.legend li{display:flex;gap:10px;align-items:flex-start}
.legend ul{list-style:none;margin:0;padding:0;display:grid;gap:8px;font-size:14px}
.empty{padding:28px 18px;border:1px dashed var(--line);border-radius:var(--r);text-align:center;color:var(--muted);display:grid;gap:12px;justify-items:center}
.install{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:14px;background:color-mix(in srgb,var(--accent) 12%,var(--surface));margin-bottom:14px}
.install p{flex:1;font-size:14px}

.tabs{position:sticky;top:calc(env(safe-area-inset-top,0px) + 64px);z-index:4;background:var(--bg);display:flex;gap:6px;overflow-x:auto;padding-block:4px 10px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:14px;color:var(--muted)}
.tab.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.dot.ok{background:var(--ok)}.dot.warn{background:var(--warn)}.dot.bad{background:var(--bad)}.dot.none{background:var(--line)}

.alert{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:14px;margin-bottom:14px;font-size:14px;text-align:left;width:100%;border:1px solid transparent}
.alert svg{width:20px;height:20px;flex:none;margin-top:1px}
.alert b{display:block}
.alert.bad{background:color-mix(in srgb,var(--bad) 13%,var(--surface));border-color:color-mix(in srgb,var(--bad) 40%,transparent);color:var(--fg)}
.alert.bad svg{color:var(--bad)}
.alert.warn{background:color-mix(in srgb,var(--warn) 12%,var(--surface));border-color:color-mix(in srgb,var(--warn) 40%,transparent)}
.alert.warn svg{color:var(--warn)}
.alert.ok{background:transparent;padding:4px 2px;color:var(--ok);font-weight:600}
.alert.ok svg{color:var(--ok)}

.stack{display:grid;gap:16px}
.field{display:grid;gap:6px;min-width:0}
.field>span,.lbl-row>span:first-child{font-size:13px;font-weight:700;letter-spacing:.02em;color:var(--muted)}
.lbl-row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
input[type=text],input[type=password],textarea,select{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:16px}
input[type=text]:focus,input[type=password]:focus,textarea:focus,select:focus{border-color:var(--accent);outline:none}
textarea{resize:vertical;line-height:1.6;min-height:120px}
textarea.script{min-height:320px}
.seg{display:flex;padding:4px;gap:4px;border-radius:12px;background:var(--surface-2);width:max-content;max-width:100%}
.seg button{border:0;background:transparent;padding:8px 14px;border-radius:9px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgb(0 0 0/.25)}
.hint{font-size:13px;color:var(--muted)}
input[type=range]{width:100%;accent-color:var(--accent)}
input[type=checkbox]{accent-color:var(--accent);width:18px;height:18px}
.busy{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--muted);flex-wrap:wrap}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--accent);animation:spin .8s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}

.card{padding:16px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);display:grid;gap:12px;min-width:0}
.card h3{font-size:16px}
.card ul{margin:0;padding-left:18px;display:grid;gap:4px;font-size:14px}
.sug{border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
.sug-text{white-space:pre-wrap;font-size:14px;line-height:1.65;max-height:420px;overflow:auto;padding:12px;border-radius:12px;background:var(--surface-2)}
.sec{display:inline-block;font-family:var(--f-mono);font-size:11px;font-weight:500;letter-spacing:.06em;padding:2px 8px;border-radius:6px;background:color-mix(in srgb,var(--blue) 22%,transparent);color:var(--fg)}
mark{background:color-mix(in srgb,var(--warn) 30%,transparent);color:var(--fg);border-radius:4px;padding:0 3px}

.msum{display:grid;gap:10px}
.bar{display:flex;height:10px;border-radius:99px;overflow:hidden;background:var(--surface-2)}
.bar i{display:block;height:100%}
.o-propio{--oc:var(--accent)}.o-stock{--oc:var(--blue)}.o-ia{--oc:var(--violet)}
.legend-row{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.legend-row span{display:inline-flex;align-items:center;gap:6px}
.legend-row i{width:10px;height:10px;border-radius:3px;background:var(--oc)}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.mitem{display:grid;gap:6px;min-width:0}
.mthumb{position:relative;aspect-ratio:1;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:var(--surface-2);padding:0;display:grid;place-items:center;max-width:100%}
.mthumb img{width:100%;height:100%;object-fit:cover;display:block}
.mthumb svg{width:26px;height:26px;color:var(--muted)}
.dur{position:absolute;right:6px;bottom:6px;background:rgb(0 0 0/.7);color:#fff;font-family:var(--f-mono);font-size:11px;padding:1px 6px;border-radius:6px}
.vbadge{position:absolute;left:6px;top:6px;width:22px;height:22px;border-radius:7px;background:rgb(0 0 0/.6);display:grid;place-items:center}
.vbadge svg{width:13px;height:13px;color:#fff}
.origin{border:0;border-radius:8px;padding:4px 6px;font-size:12px;font-weight:700;background:color-mix(in srgb,var(--oc) 18%,transparent);color:var(--oc)}

.thumb-wrap{border-radius:14px;overflow:hidden;border:1px solid var(--line);aspect-ratio:16/9;max-width:100%;background:#000}
.thumb-wrap canvas{width:100%;height:100%;display:block}
.hstrip{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.bgopt{flex:none;width:76px;aspect-ratio:16/10;border-radius:10px;border:2px solid transparent;overflow:hidden;padding:0;background:var(--surface-2);display:grid;place-items:center;font-size:12px;font-weight:600;color:var(--muted)}
.bgopt img{width:100%;height:100%;object-fit:cover}
.bgopt.on{border-color:var(--accent)}
.bgopt svg{width:20px;height:20px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chipbtn{border:1px solid var(--line);background:var(--surface);padding:7px 12px;border-radius:10px;font-weight:600;font-size:14px}
.chipbtn.on{border-color:var(--accent);color:var(--accent)}
.sw{width:34px;height:34px;border-radius:50%;border:3px solid var(--bg);box-shadow:0 0 0 1px var(--line)}
.sw.on{box-shadow:0 0 0 2px var(--accent)}
.idea{display:grid;gap:4px;text-align:left;width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface)}
.idea b{font-family:var(--f-display);font-size:16px;text-transform:uppercase;letter-spacing:.01em}
.idea span{font-size:13px;color:var(--muted)}
.scores{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.score{padding:10px;border-radius:12px;background:var(--surface-2);text-align:center}
.score b{display:block;font-family:var(--f-display);font-size:22px}
.score span{font-size:12px;color:var(--muted)}

.meter{height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.meter i{display:block;height:100%;border-radius:99px}
.tlist{display:grid;gap:8px}
.tcard{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;align-items:start;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface)}
.tcard.on{border-color:var(--accent)}
.tcard .tt{font-weight:700;line-height:1.35}
.tcard .tm{grid-column:1/-1;display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.tscore{font-family:var(--f-display);font-weight:800;font-size:18px;color:var(--accent)}

.gauge{display:grid;justify-items:center;gap:4px;padding:18px 16px 16px;text-align:center}
.gauge svg{width:200px;max-width:100%;height:auto}
.gauge .num{font-family:var(--f-display);font-weight:800;font-size:44px;line-height:1;margin-top:-58px}
.gauge .lab{font-weight:700;margin-top:6px}
.sig{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;padding:12px 0;border-top:1px solid var(--line)}
.sig:first-child{border-top:0}
.sig .dot{margin-top:7px}
.sig b{font-size:15px}
.sig p{grid-column:2;font-size:14px;color:var(--muted)}
.sig .fix{grid-column:2;font-size:13px;color:var(--fg)}
.flag{display:grid;gap:4px;padding:12px;border-radius:12px;background:var(--surface-2);font-size:14px}
.flag .q{font-weight:700;font-style:italic}
.flag .alt{color:var(--accent)}

.check{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 12px;align-items:start;padding:12px 0;border-top:1px solid var(--line)}
.check:first-child{border-top:0}
.ck{width:24px;height:24px;border-radius:8px;display:grid;place-items:center;border:2px solid var(--line);font-weight:800}
.ck svg{width:15px;height:15px}
.ck.ok{background:var(--ok);border-color:var(--ok);color:var(--accent-ink)}
.ck.warn{border-color:var(--warn);color:var(--warn)}
.check b{font-size:15px}
.check p{grid-column:2;font-size:13px;color:var(--muted)}
.toggle{display:flex;gap:12px;align-items:flex-start;padding:14px;border-radius:14px;background:var(--surface-2);text-align:left;border:0;width:100%}
.sw-t{flex:none;width:44px;height:26px;border-radius:99px;background:var(--line);position:relative;transition:background .2s}
.sw-t::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .2s}
.toggle.on .sw-t{background:var(--accent)}
.toggle.on .sw-t::after{transform:translateX(18px)}

/* voz */
.takes{display:grid;gap:8px}
.take{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:10px 12px;border-radius:14px;border:1px solid var(--line);background:var(--surface)}
.take .nm{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.take .mt{font-size:12px;color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.playb{width:42px;height:42px;border-radius:50%;border:0;background:var(--surface-2);display:grid;place-items:center}
.playb svg{width:18px;height:18px}
.playb.on{background:var(--accent);color:var(--accent-ink)}
.k-grabacion{--kc:var(--accent)}.k-editada{--kc:var(--blue)}.k-ia{--kc:var(--violet)}
.kchip{font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;background:color-mix(in srgb,var(--kc) 18%,transparent);color:var(--kc)}
.wave{width:100%;height:120px;display:block;border-radius:12px;background:var(--surface-2);touch-action:none}
.edgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.edgrid .btn{min-height:44px;font-size:14px}
.tele{height:38vh;min-height:200px;overflow:auto;padding:18px;border-radius:14px;background:var(--surface-2);font-size:24px;line-height:1.55;font-weight:600;white-space:pre-wrap;scroll-behavior:auto}
.tele .sec{font-size:12px;vertical-align:middle}
.levelbar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.levelbar i{display:block;height:100%;width:0;background:var(--accent);transition:width .08s linear}
.rec-row{display:flex;align-items:center;justify-content:center;gap:16px}
.recb{width:76px;height:76px;border-radius:50%;border:4px solid var(--line);background:var(--rec);display:grid;place-items:center;color:#fff}
.recb svg{width:28px;height:28px}
.recb.on{border-color:color-mix(in srgb,var(--rec) 50%,transparent);animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 10px color-mix(in srgb,var(--rec) 20%,transparent)}}
@media (prefers-reduced-motion:reduce){.recb.on{animation:none}}
.timer{font-family:var(--f-mono);font-size:28px;text-align:center;font-variant-numeric:tabular-nums}
.vlist{display:grid;gap:8px;max-height:320px;overflow:auto}
.vopt{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);text-align:left;width:100%}
.vopt.on{border-color:var(--accent)}
.vopt .vn{flex:1;min-width:0}
.vopt .vn b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vopt .vn span{font-size:12px;color:var(--muted)}
.cklist{display:grid;gap:8px}
.cklist label{display:flex;gap:10px;align-items:center;font-size:14px}

#sheet{position:fixed;inset:0;z-index:30}
.scrim{position:absolute;inset:0;background:rgb(3 8 16/.6)}
.panel{position:absolute;left:0;right:0;bottom:0;max-height:94%;overflow:auto;background:var(--bg);border-radius:22px 22px 0 0;border-top:1px solid var(--line);
  padding:18px max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.panel-in{max-width:560px;margin:0 auto;display:grid;gap:14px}
.panel-h{display:flex;align-items:center;gap:10px}
.panel-h h3{flex:1;font-size:18px;min-width:0;overflow:hidden;text-overflow:ellipsis}
.stage{border-radius:14px;overflow:hidden;background:#000;max-width:100%;max-height:52vh;margin:0 auto;width:100%}
.stage img,.stage video{width:100%;height:100%;object-fit:cover;display:block}
.stage video{object-fit:contain}
.slider{display:grid;grid-template-columns:90px minmax(0,1fr) 54px;gap:10px;align-items:center;font-size:14px}
.menu-list{display:grid;gap:8px}
.menu-list .btn{justify-content:flex-start}
.danger{color:var(--bad)}

<script>
"use strict";
/* =========================================================
   VidCreator — app instalable (PWA)
   Datos en el teléfono (IndexedDB). IA y voces IA vía /api (Vercel).

/* ---------- helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-5);
const norm = s => String(s || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
const hash = s => { let h = 5381; for (let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) | 0; return String(h >>> 0); };
const slug = s => norm(s).replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 50) || "video";
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function rel(t) {
  if (!t) return "";
  const m = Math.round((Date.now() - t) / 60000);
  if (m < 1) return "recién";
  if (m < 60) return "hace " + m + " min";
  const h = Math.round(m / 60);
  if (h < 24) return "hace " + h + " h";
  const d = Math.round(h / 24);
  return d === 1 ? "ayer" : "hace " + d + " días";
}
const fmtDur = s => { if (s == null || !isFinite(s)) return ""; s = Math.max(0, Math.round(s)); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); };
const fmtSec = s => (Math.round(s * 10) / 10).toFixed(1) + " s";
const lsGet = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };

const IC = {
  back: '<path d="M15 18l-6-6 6-6"/>',
  more: '<circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/>',
  plus: '<path d="M12 5v14M5 12h14"/>',
  wand: '<path d="M15 4V2M15 10V8M11 6H9M21 6h-2M18.5 3.5l-1 1M18.5 8.5l-1-1M3 21l11-11"/>',

  shield: '<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M8.5 12l2.5 2.5 4.5-5"/>',
  x: '<path d="M6 6l12 12M18 6L6 18"/>',

  wave: '<path d="M3 12h2M7 8v8M11 5v14M15 9v6M19 7v10M21 12h0"/>',
  gear: '<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.8.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/>',
  undo: '<path d="M9 14L4 9l5-5"/><path d="M4 9h11a5 5 0 010 10h-3"/>'
};
const ic = n => '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + IC[n] + "</svg>";
const LOGO = '<svg class="logo" viewBox="0 0 40 40" aria-hidden="true"><rect width="40" height="40" rx="11" fill="var(--accent)"/><path d="M15 11.5v17l14-8.5z" fill="var(--accent-ink)" stroke="var(--accent-ink)" stroke-width="2" stroke-linejoin="round"/></svg>';

/* ---------- estado ---------- */
const S = {
  docs: {}, loaded: false, view: "home", pid: null, tab: "guion",
  media: {}, takes: {}, imgCache: {}, suggest: {}, busy: {}, sheet: null, ed: null, au: null, rec: null,
  status: undefined, voices: null, voiceMode: "mia", ttsPart: "all", installEvt: null
};
const TABS = [["guion", "Guión"], ["voz", "Voz"], ["media", "Fotos y videos"], ["mini", "Miniatura"], ["titulos", "Títulos"], ["orig", "Originalidad"], ["publicar", "Publicar"]];
const cur = () => (S.pid && S.docs[S.pid] && S.docs[S.pid].kind === "project") ? Object.assign(S.docs[S.pid], { id: S.pid }) : null;
const projects = () => Object.keys(S.docs).filter(id => S.docs[id].kind === "project").map(id => Object.assign(S.docs[id], { id })).sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
const settings = () => S.docs.settings || (S.docs.settings = { kind: "settings" });

/* ---------- almacenamiento en el teléfono (IndexedDB) ---------- */
const DB = {
  db: null, mem: { docs: {}, blobs: {} },
  open() {
    return new Promise(res => {
      try {
        const r = indexedDB.open("vidcreator", 1);
        r.onupgradeneeded = () => { const d = r.result; if (!d.objectStoreNames.contains("docs")) d.createObjectStore("docs"); if (!d.objectStoreNames.contains("blobs")) d.createObjectStore("blobs"); };
        r.onsuccess = () => { this.db = r.result; res(true); };
        r.onerror = () => res(false);
      } catch (e) { res(false); }
    });
  },
  req(store, mode, fn) {
    if (!this.db) return Promise.resolve(fn(null));
    return new Promise((res, rej) => {
      const t = this.db.transaction(store, mode); const r = fn(t.objectStore(store)); let out;
      if (r) r.onsuccess = () => { out = r.result; };
      t.oncomplete = () => res(out); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
    });
  },
  get(store, key) { return this.db ? this.req(store, "readonly", s => s.get(key)) : Promise.resolve(this.mem[store][key]); },
  put(store, key, val) { if (!this.db) { this.mem[store][key] = val; return Promise.resolve(); } return this.req(store, "readwrite", s => s.put(val, key)); },
  del(store, key) { if (!this.db) { delete this.mem[store][key]; return Promise.resolve(); } return this.req(store, "readwrite", s => s.delete(key)); },
  all(store) {
    if (!this.db) return Promise.resolve(Object.assign({}, this.mem[store]));
    return new Promise((res, rej) => {
      const out = {}; const t = this.db.transaction(store, "readonly"); const c = t.objectStore(store).openCursor();
      c.onsuccess = () => { const k = c.result; if (k) { out[k.key] = k.value; k.continue(); } };
      t.oncomplete = () => res(out); t.onerror = () => rej(t.error);
    });
  }
};
const timers = new Map(), inflight = new Map();
let syncState = "ok";
function save(id, delay = 500) {
  setSync("saving");
  clearTimeout(timers.get(id));
  timers.set(id, setTimeout(() => flush(id), delay));
}
async function flush(id) {
  timers.delete(id);
  if (inflight.has(id)) { try { await inflight.get(id); } catch (e) {} if (timers.has(id)) return; }
  const doc = S.docs[id]; if (!doc) return;
  const body = JSON.parse(JSON.stringify(doc)); delete body.id;
  const p = DB.put("docs", id, body); inflight.set(id, p);
  try { await p; setSync("ok"); }
  catch (e) { setSync("err"); toast("No se pudo guardar. Revisa el espacio libre del teléfono."); }
  finally { inflight.delete(id); }
}
function setSync(s) { syncState = s; const el = $("#sync"); if (el) el.textContent = syncLabel(); }
function syncLabel() {
  if (syncState === "saving") return "Guardando…";
  if (syncState === "err") return "Sin guardar";
  return DB.db ? "Guardado en el teléfono" : "Sin almacenamiento";
}
function touch(p) { p.updatedAt = Date.now(); }

/* ---------- conexión con el servidor (/api) ---------- */
const getCode = () => lsGet("vc_code") || "";
async function api(path, opts) {
  opts = opts || {};
  const headers = Object.assign({ "x-app-code": getCode() }, opts.json ? { "content-type": "application/json" } : {}, opts.headers || {});
  const r = await fetch(path, { method: opts.method || (opts.json ? "POST" : "GET"), headers, body: opts.json ? JSON.stringify(opts.json) : opts.body, signal: opts.signal });
  if (!r.ok) {
    let msg = ""; try { msg = (await r.json()).error || ""; } catch (e) {}
    const err = new Error(msg || "HTTP " + r.status); err.status = r.status; throw err;
  }
  return r;
}
async function loadStatus() {
  try { const r = await api("/api/status"); S.status = await r.json(); }
  catch (e) { S.status = e.status === 401 ? { auth: false } : null; }
}
function apiErr(e) {
  if (e && e.code === "invalid_json") return "La respuesta llegó incompleta. Toca el botón otra vez.";
  if (!e || !e.status) return navigator.onLine === false ? "Sin internet. Esta función necesita conexión." : "No se pudo conectar con el servidor.";
  if (e.status === 401) return "Código de acceso incorrecto. Revísalo en Ajustes.";
  if (e.status === 503) return e.message || "Falta configurar una clave en Vercel.";
  if (e.status === 429) return "Demasiadas consultas seguidas o se acabó el saldo. Espera e intenta de nuevo.";
  if (e.status === 413) return "El texto es demasiado largo.";
  return e.message || "Algo falló en el servidor. Intenta de nuevo.";
}
function parseJSON(text) {
  try { return JSON.parse(text); } catch (e) {}
  const f = text.match(/```(?:json)?\s*([\s\S]*?)```/);
  if (f) { try { return JSON.parse(f[1]); } catch (e) {} }
  const starts = ["{", "["].map(c => text.indexOf(c)).filter(i => i >= 0);
  const i = starts.length ? Math.min(...starts) : -1;
  const j = Math.max(text.lastIndexOf("}"), text.lastIndexOf("]"));
  if (i >= 0 && j > i) { try { return JSON.parse(text.slice(i, j + 1)); } catch (e) {} }
  const err = new Error("json"); err.code = "invalid_json"; throw err;
}
const blobToB64 = blob => new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(String(fr.result).split(",")[1]); fr.onerror = rej; fr.readAsDataURL(blob); });

async function runBusy(key, label, fn) {
  if (S.busy[key]) return null;
  const ctl = new AbortController();
  S.busy[key] = { ctl, t0: Date.now(), label };
  render();
  const tick = setInterval(() => {
    const b = S.busy[key]; const el = document.querySelector('[data-busy="' + key + '"]');
    if (b && el) el.textContent = b.label + " · " + Math.round((Date.now() - b.t0) / 1000) + " s";
  }, 1000);
  try { return await fn(ctl.signal, l => { if (S.busy[key]) S.busy[key].label = l; }); }
  catch (e) { if (!(e && e.name === "AbortError")) toast(apiErr(e)); return null; }
  finally { clearInterval(tick); delete S.busy[key]; render(); }
}
function askJSON(key, label, prompt, opts) {
  return runBusy(key, label, async signal => {
    const body = { prompt: prompt + "\n\nResponde únicamente con el JSON, sin texto antes ni después." };
    if (opts && opts.images) body.images = await Promise.all(opts.images.map(async b => ({ data: await blobToB64(b), media_type: b.type || "image/jpeg" })));
    const r = await api("/api/ai", { json: body, signal });
    const j = await r.json();
    return parseJSON(j.text || "");
  });
}
function busyUI(key) {
  const b = S.busy[key]; if (!b) return "";
  return '<div class="busy"><span class="spin"></span><span data-busy="' + key + '">' + esc(b.label) + '</span><button class="btn sm ghost" data-act="stop" data-k="' + key + '">' + ic("stop") + "Detener</button></div>";
}
function aiNote(kind) {
  const st = S.status;
  if (st === undefined) return "";
  if (st === null) return '<p class="hint">Sin conexión con el servidor: las funciones con IA necesitan internet.</p>';
  if (st.auth === false) return '<p class="hint">Ingresa tu código de acceso en <button class="btn sm ghost" data-act="settings">Ajustes</button> para usar la IA.</p>';
  if (kind === "voice" ? !st.voice : !st.ai) return '<p class="hint">' + (kind === "voice" ? "Falta ELEVENLABS_API_KEY" : "Falta ANTHROPIC_API_KEY") + " en Vercel. Revisa la guía de instalación.</p>";
  return "";
}

/* ---------- archivos: descargar y compartir ---------- */
function saveFile(name, blob) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a"); a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
  toast("Descargando " + name);
}
async function shareFile(name, blob) {
  try {
    const f = new File([blob], name, { type: blob.type });
    if (navigator.canShare && navigator.canShare({ files: [f] })) { await navigator.share({ files: [f], title: name }); return; }
  } catch (e) { if (e && e.name === "AbortError") return; }
  saveFile(name, blob);
}
async function copyText(t) {
  try { await navigator.clipboard.writeText(t); toast("Copiado"); }
  catch (e) { toast("No se pudo copiar. Mantén presionado el texto para copiarlo."); }
}
let toastT;
function toast(msg) { const el = $("#toast"); el.textContent = msg; el.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { el.hidden = true; }, 3400); }

/* ---------- proyectos ---------- */
function newProject(extra) {
  const now = Date.now();
  return Object.assign({
    kind: "project", name: "Video sin título", topic: "", voice: "propia", script: "",
    thumb: { l1: "", l2: "", layout: "izq", color: "#3EE6A0", dark: 45, bgId: "" },
    media: [], takes: [], titles: [], title: "", description: "", tagsText: "",

  }, extra || {});
}
function seed() {
  const id = uid();
  S.docs[id] = newProject({
    example: true,
    name: "Ejemplo · Ganar dinero en YouTube",
    topic: "Cómo ganar dinero en YouTube en 2026",

    thumb: { l1: "Gana con YouTube", l2: "en 2026", layout: "izq", color: "#3EE6A0", dark: 45, bgId: "" }
  });
  settings().seeded = true;
  save(id, 50); save("settings", 50);
}
async function ensureBlobs(p) {
  const list = S.media[p.id] || (S.media[p.id] = {});
  let changed = false;
  for (const m of p.media || []) {
    if (list[m.id]) continue;
    const blob = await DB.get("blobs", m.id).catch(() => null);
    if (!blob) continue;
    const url = URL.createObjectURL(blob);
    list[m.id] = { url, kind: m.kind, blob };
    if (m.kind === "image") loadImg(m.id, url);
    changed = true;
  }
  for (const t of p.takes || []) {
    if (S.takes[t.id]) continue;
    const blob = await DB.get("blobs", t.id).catch(() => null);
    if (!blob) continue;
    S.takes[t.id] = { blob, url: URL.createObjectURL(blob) };
    changed = true;
  }
  if (changed && S.view === "project" && S.pid === p.id && !S.sheet && !isTyping()) render();
}
const isTyping = () => { const a = document.activeElement; return a && (a.tagName === "TEXTAREA" || (a.tagName === "INPUT" && /text|password/.test(a.type))); };

/* ---------- análisis de originalidad (local) ---------- */
const CLICHES = ["en el mundo actual", "en la era digital", "hoy en dia", "sin mas preambulos", "en este video te voy a mostrar", "en este video te voy a ensenar", "en este video te voy a explicar", "hola a todos y bienvenidos", "es importante destacar", "cabe destacar", "vale la pena mencionar", "en resumen", "en conclusion", "sin lugar a dudas", "la clave del exito", "desbloquea", "desbloquear", "sumergete", "descubre como", "transformar tu vida", "transforma tu vida", "cambiara tu vida", "tu potencial", "al final del dia", "un mundo de posibilidades", "da el primer paso", "juega un papel crucial", "papel fundamental", "navegar por", "contenido de valor", "contenido de calidad", "fascinante", "revolucionario", "en definitiva", "en pocas palabras", "al siguiente nivel", "el secreto que nadie", "lo que nadie te dice", "elige un nicho que te apasione"];
const FP = new Set(["yo", "mi", "mis", "me", "conmigo", "aprendi", "descubri", "cometi", "perdi", "gane", "empece", "intente", "probe", "vivi", "mio", "mia", "estaba", "tenia", "decidi", "sentia", "logre", "fui", "hice", "pense", "trabaje", "subi", "grabe", "nos", "nuestro", "nuestra"]);
const SENS = /(finanz|dinero|invers|accion|cripto|bitcoin|deuda|credito|ahorr|salud|medic|enfermedad|dieta|medicament|impuesto|jubilac|afp|prestamo|bolsa)/;
function shingles(t) { const w = norm(t).match(/[a-zñ0-9]+/g) || []; const s = new Set(); for (let i = 0; i + 2 < w.length; i++) s.add(w[i] + " " + w[i + 1] + " " + w[i + 2]); return s; }
function jacc(a, b) { if (!a.size || !b.size) return 0; let i = 0; for (const x of a) if (b.has(x)) i++; return i / (a.size + b.size - i); }

function analyze(p) {
  const text = p.script || "";
  const n = norm(text);
  const words = n.match(/[a-zñ0-9]+/g) || [];
  const wc = words.length;
  const media = p.media || [];
  const out = { wc, signals: [], local: null, score: null, level: "none", aiFresh: false };
  if (wc < 15) return out;
  const W = { frases: 24, exp: 22, datos: 10, ext: 12, media: 14, voz: 20, sim: 18 };
  let pen = 0;
  const add = (key, label, state, detail, fix) => {
    out.signals.push({ key, label, state, detail, fix });
    if (state === "bad") pen += W[key]; else if (state === "warn") pen += W[key] * 0.45;
  };
  const found = CLICHES.filter(c => n.includes(c));
  add("frases", "Frases genéricas", found.length >= 3 ? "bad" : found.length ? "warn" : "ok",
    found.length ? found.length + " encontradas: " + found.slice(0, 5).map(f => "“" + f + "”").join(", ") : "No aparecen frases típicas de guiones automáticos.",
    found.length ? "Cámbialas por cómo lo dirías tú hablando con un amigo." : "");
  if (found.length > 3) pen += Math.min(10, (found.length - 3) * 3);

  const fp = words.filter(w => FP.has(w)).length;
  const rate = fp / wc * 100;
  add("exp", "Experiencia propia", rate >= 2.5 ? "ok" : rate >= 1 ? "warn" : "bad",
    fp + " menciones en primera persona en " + wc + " palabras.",
    rate >= 2.5 ? "" : "Cuenta algo que te pasó a ti: un error, un resultado, lo que aprendiste.");

  const clean = text.replace(/^\s*\d+[.)]/gm, "");
  const nums = (clean.match(/\d+([.,]\d+)?/g) || []).filter(x => !/^(19|20)\d\d$/.test(x)).length;
  add("datos", "Datos y ejemplos concretos", nums >= 3 ? "ok" : nums >= 1 ? "warn" : "bad",
    nums ? nums + " cifras o datos específicos." : "No hay cifras, montos ni fechas propias.",
    nums >= 3 ? "" : "Suma números reales: cuánto, en cuánto tiempo, qué resultado.");

  const blob = new Blob(r.chunks, { type: r.mime });
  S.rec = null; S.sheet = null; renderSheet();
  const id = await addTake(p, blob, "grabacion", takeName(p, "grabacion"), r.acc);
  toast("Toma guardada. Ábrela para editarla.");
  render();
  openEditor(id);
}

/* editor de audio */
async function openEditor(takeId) {
  const p = cur(); const t = (p.takes || []).find(x => x.id === takeId); const b = S.takes[takeId];
  if (!t || !b) { toast("Este audio no está disponible."); return; }
  try {
    const x = await decodeBlob(b.blob);
    S.au = { takeId, x, a: 0, b: AU.dur(x), undo: [], speed: 100 };
    S.sheet = { type: "audio" }; renderSheet();
  } catch (e) { toast("No se pudo abrir este audio."); }
}
function auApply(fn, msg) {
  const st = S.au; if (!st) return;
  Player.stop();
  st.undo.push(st.x); if (st.undo.length > 6) st.undo.shift();
  st.x = fn(st.x);
  st.a = clamp(st.a, 0, AU.dur(st.x)); st.b = AU.dur(st.x);
  if (st.a >= st.b) st.a = 0;
  renderSheet(); if (msg) toast(msg);
}

/* voz IA */
async function loadVoices() {
  await runBusy("voices", "Cargando voces", async signal => {
    const r = await api("/api/voices", { signal }); const j = await r.json();
    S.voices = j.voices || [];
  });
}
async function genTTS(p) {
  const st = settings();
  if (!st.voiceId) { toast("Elige una voz primero."); return; }
  const src = S.ttsPart === "all" ? p.script : ((sections(p.script).find(s => s.name === S.ttsPart) || {}).text || "");
  const text = cleanSpeech(src);
  if (text.length < 10) { toast("No hay texto para narrar."); return; }
  const chunks = chunkText(text, 2200);
  await runBusy("tts", "Generando voz", async (signal, setLabel) => {
    const parts = [];
    for (let i = 0; i < chunks.length; i++) {
      setLabel("Generando voz, parte " + (i + 1) + " de " + chunks.length);
      const r = await api("/api/tts", { json: { voiceId: st.voiceId, text: chunks[i] }, signal });
      parts.push(await decodeBlob(await r.blob()));
    }
    const x = AU.concat(parts.map(q => AU.toRate(q, parts[0].sr)), 0.2);
    const label = (st.voiceName || "Voz IA") + (S.ttsPart === "all" ? "" : " · " + S.ttsPart.toLowerCase());
    await addTake(p, AU.wav(x), "ia", label, AU.dur(x));
    if (p.voice !== "ia") { p.voice = "ia"; save(p.id); toast("Narración marcada como Voz IA para la alerta de originalidad."); }
    else toast("Voz generada");
  });
}
async function cloneVoice(p) {
  const st = settings();
  if (!S.cloneConsent) { toast("Confirma que es tu propia voz."); return; }
  const ids = Array.from(document.querySelectorAll("[data-clone]:checked")).map(el => el.dataset.clone);
  if (!ids.length) { toast("Elige al menos una grabación tuya."); return; }
  await runBusy("clone", "Preparando tus grabaciones", async (signal, setLabel) => {
    const xs = [];
    for (const id of ids) { const b = S.takes[id]; if (b) xs.push(AU.toRate(await decodeBlob(b.blob), 16000)); }
    let total = xs.reduce((s, x) => s + AU.dur(x), 0);
    if (total < 30) { toast("Necesitas al menos 30 segundos de tu voz. Tienes " + Math.round(total) + " s."); return; }
    let left = 90; const files = [];
    for (const x of xs) {
      if (left <= 1) break;
      const piece = AU.dur(x) > left ? AU.slice(x, 0, left) : x;
      left -= AU.dur(piece);
      files.push({ b64: await blobToB64(AU.wav(AU.normalize(piece))), type: "audio/wav", name: "muestra-" + (files.length + 1) + ".wav" });
    }
    setLabel("Creando tu voz en ElevenLabs");
    const r = await api("/api/clone", { json: { name: "Mi voz · VidCreator", files, consent: true }, signal });
    const j = await r.json();
    st.clone = { id: j.voiceId, name: "Mi voz (clonada)" };
    st.voiceId = j.voiceId; st.voiceName = "Mi voz (clonada)";
    save("settings");
    S.voices = null;
    toast(j.requiresVerification ? "Voz creada. ElevenLabs pide verificarla en su web antes de usarla." : "Tu voz IA está lista.");
  });
}

/* --- Miniatura --- */
const COLORS = ["#3EE6A0", "#FFD23F", "#FF4D4D", "#4C8DFF", "#FFFFFF"];

function getImg(id) { const im = S.imgCache[id]; return im && im.complete && im.naturalWidth ? im : null; }
function loadImg(id, url) { const im = new Image(); im.onload = () => { if (S.view === "project" && S.tab === "mini") drawThumb(); }; im.src = url; S.imgCache[id] = im; }
function fitText(c, text, maxW, maxSize, minSize, maxLines) {
  const words = text.split(/\s+/).filter(Boolean);
  for (let size = maxSize; size >= minSize; size -= 4) {
    c.font = size + "px Anton, Impact, 'Arial Narrow', sans-serif";
    const lines = []; let line = "";
    for (const w of words) { const t = line ? line + " " + w : w; if (c.measureText(t).width <= maxW || !line) line = t; else { lines.push(line); line = w; } }
    if (line) lines.push(line);
    if (lines.length <= maxLines && lines.every(l => c.measureText(l).width <= maxW)) return { lines, size };
  }
  return { lines: [text], size: minSize };
}
function drawLines(c, fit, x, y, align, fill, stroke) {
  c.font = fit.size + "px Anton, Impact, 'Arial Narrow', sans-serif";
  c.textAlign = align; c.textBaseline = "top"; c.lineJoin = "round";
  const lh = fit.size * 1.02;
  fit.lines.forEach((l, i) => {
    if (stroke) { c.lineWidth = Math.max(6, fit.size * 0.09); c.strokeStyle = stroke; c.strokeText(l, x, y + i * lh); }
    c.fillStyle = fill; c.fillText(l, x, y + i * lh);
  });
  return fit.lines.length * lh;
}
function drawThumb() {
  const cv = $("#thumbCv"); const p = cur(); if (!cv || !p) return;
  const c = cv.getContext("2d"), W = 1280, H = 720, t = p.thumb || {};
  c.save(); c.clearRect(0, 0, W, H);
  const bg = t.bgId && getImg(t.bgId);
  if (bg) {
    const r = Math.max(W / bg.naturalWidth, H / bg.naturalHeight), w = bg.naturalWidth * r, h = bg.naturalHeight * r;
    c.drawImage(bg, (W - w) / 2, (H - h) / 2, w, h);
  } else {
    const g = c.createLinearGradient(0, 0, W, H); g.addColorStop(0, "#0a1626"); g.addColorStop(1, "#103a3a");
    c.fillStyle = g; c.fillRect(0, 0, W, H);
    const rg = c.createRadialGradient(W * 0.82, H * 0.3, 20, W * 0.82, H * 0.3, 520);
    rg.addColorStop(0, (t.color || "#3EE6A0") + "88"); rg.addColorStop(1, "rgba(0,0,0,0)");
    c.fillStyle = rg; c.fillRect(0, 0, W, H);
  }
  const dark = (t.dark ?? 45) / 100, accent = t.color || "#3EE6A0";
  const l1 = String(t.l1 || "").toUpperCase(), l2 = String(t.l2 || "").toUpperCase();
  if (t.layout === "centro") {
    c.fillStyle = "rgba(0,0,0," + (dark * 0.85) + ")"; c.fillRect(0, 0, W, H);
    const f1 = fitText(c, l1 || "TU TEXTO", W - 160, 190, 70, 2); const f2 = l2 ? fitText(c, l2, W - 240, 120, 50, 1) : null;
    let y = (H - (f1.lines.length * f1.size * 1.02 + (f2 ? f2.size * 1.1 : 0))) / 2;
    y += drawLines(c, f1, W / 2, y, "center", "#ffffff", "rgba(0,0,0,.85)");
    if (f2) drawLines(c, f2, W / 2, y + f2.size * 0.08, "center", accent, "rgba(0,0,0,.85)");
  } else if (t.layout === "franja") {
    c.fillStyle = "rgba(0,0,0," + (dark * 0.5) + ")"; c.fillRect(0, 0, W, H);
    const bandH = 210; c.fillStyle = accent; c.fillRect(0, H - bandH, W, bandH);
    const ink = ["#FF4D4D", "#4C8DFF"].includes(accent) ? "#ffffff" : "#0a0f18";
    const f1 = fitText(c, l1 || "TU TEXTO", W - 140, 160, 60, 1);
    drawLines(c, f1, 70, H - bandH + (bandH - f1.size) / 2, "left", ink, null);
    if (l2) { const f2 = fitText(c, l2, W - 140, 110, 50, 1); drawLines(c, f2, 70, H - bandH - f2.size - 24, "left", "#ffffff", "rgba(0,0,0,.85)"); }
  } else {
    const g = c.createLinearGradient(0, 0, W * 0.8, 0);
    g.addColorStop(0, "rgba(0,0,0," + Math.min(0.95, dark + 0.25) + ")"); g.addColorStop(1, "rgba(0,0,0,0)");
    c.fillStyle = g; c.fillRect(0, 0, W, H);
    const f1 = fitText(c, l1 || "TU TEXTO", W * 0.6, 180, 64, 3); const f2 = l2 ? fitText(c, l2, W * 0.6, 120, 48, 1) : null;
    let y = (H - (f1.lines.length * f1.size * 1.02 + (f2 ? f2.size * 1.1 : 0))) / 2;
    y += drawLines(c, f1, 70, y, "left", "#ffffff", "rgba(0,0,0,.85)");
    if (f2) drawLines(c, f2, 70, y + f2.size * 0.08, "left", accent, "rgba(0,0,0,.85)");
  }
  c.restore();
}

        '<div class="chips">' + [["orig", "Original"], ["169", "16:9"], ["916", "9:16"], ["11", "1:1"]].map(([k, l]) => '<button class="chipbtn' + (ed.crop === k ? " on" : "") + '" data-act="edCrop" data-c="' + k + '">' + l + "</button>").join("") + "</div>" +
        [["b", "Brillo"], ["c", "Contraste"], ["s", "Saturación"]].map(([k, l]) => '<label class="slider"><span>' + l + '</span><input type="range" id="ed-' + k + '" min="50" max="150" value="' + ed[k] + '" data-ed="' + k + '"><span class="mono" id="edv-' + k + '">' + ed[k] + "%</span></label>").join("") +
        '<div class="actions"><button class="btn primary" data-act="edSave">' + ic("check") + 'Guardar copia</button><button class="btn" data-act="edThumb">' + ic("image") + "Usar en miniatura</button></div>" +
        '<div class="actions"><button class="btn" data-act="edDownload">' + ic("dl") + 'Descargar</button><button class="btn danger" data-act="rmMedia" data-mid="' + meta.id + '">Quitar</button></div>';
    }
  }
  const oldPanel = el.querySelector(".panel"), oldTele = el.querySelector("#tele");
  const keep = { panel: oldPanel ? oldPanel.scrollTop : 0, tele: oldTele ? oldTele.scrollTop : 0, type: el.dataset.type };
  el.innerHTML = '<div class="scrim"' + (s.type === "rec" && S.rec && S.rec.mr ? "" : ' data-act="closeSheet"') + '></div><div class="panel" role="dialog" aria-modal="true"><div class="panel-in">' + inner + "</div></div>";
  el.hidden = false;
  if (keep.type === s.type) {
    const np = el.querySelector(".panel"), nt = el.querySelector("#tele");
    if (np) np.scrollTop = keep.panel; if (nt) nt.scrollTop = keep.tele;

}
const edFilter = ed => "brightness(" + ed.b + "%) contrast(" + ed.c + "%) saturate(" + ed.s + "%)";
function edRender(meta) {
  const im = getImg(meta.id); if (!im) return null;
  const ed = S.ed, iw = im.naturalWidth, ih = im.naturalHeight;
  const target = { orig: iw / ih, "169": 16 / 9, "916": 9 / 16, "11": 1 }[ed.crop];
  let sw = iw, sh = ih; if (iw / ih > target) sw = ih * target; else sh = iw / target;
  const sx = (iw - sw) / 2, sy = (ih - sh) / 2, scale = Math.min(1, 1920 / Math.max(sw, sh));
  const cw = Math.round(sw * scale), ch = Math.round(sh * scale);
  const cv = document.createElement("canvas"); cv.width = cw; cv.height = ch;
  const c = cv.getContext("2d"); c.drawImage(im, sx, sy, sw, sh, 0, 0, cw, ch);
  if (ed.b !== 100 || ed.c !== 100 || ed.s !== 100) {
    const d = c.getImageData(0, 0, cw, ch), px = d.data, B = ed.b / 100, C = ed.c / 100, Sa = ed.s / 100;
    for (let i = 0; i < px.length; i += 4) {
      let r = px[i] * B, g = px[i + 1] * B, bl = px[i + 2] * B;
      r = ((r / 255 - 0.5) * C + 0.5) * 255; g = ((g / 255 - 0.5) * C + 0.5) * 255; bl = ((bl / 255 - 0.5) * C + 0.5) * 255;
      const l = 0.2126 * r + 0.7152 * g + 0.0722 * bl;
      px[i] = l + (r - l) * Sa; px[i + 1] = l + (g - l) * Sa; px[i + 2] = l + (bl - l) * Sa;
    }
    c.putImageData(d, 0, 0);
  }
  return cv;
}
const toBlob = (cv, type, q) => new Promise(res => cv.toBlob(res, type || "image/png", q));

/* ---------- fotos y videos ---------- */
async function addFiles(files, opts) {
  const p = cur(); if (!p) return [];
  const list = S.media[p.id] || (S.media[p.id] = {});
  p.media = p.media || []; const added = [];
  for (const f of files) {
    const kind = f.type.startsWith("video") ? "video" : f.type.startsWith("image") ? "image" : null;
    if (!kind) continue;
    const id = uid();
    try { await DB.put("blobs", id, f); } catch (e) { toast("No hay espacio para guardar " + f.name + "."); continue; }
    const url = URL.createObjectURL(f);
    list[id] = { url, kind, blob: f };
    p.media.push({ id, name: String(f.name || (kind === "image" ? "foto" : "video")).slice(0, 80), kind, origin: (opts && opts.origin) || "propio", duration: null });
    added.push(id);
    if (kind === "video") probeVideo(p.id, id, url); else loadImg(id, url);
  }
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  touch(p); save(p.id);
  return added;
}
function probeVideo(pid, id, url) {
  const v = document.createElement("video");
  v.muted = true; v.playsInline = true; v.preload = "metadata"; v.src = url;
  v.onloadedmetadata = () => {
    const p = S.docs[pid]; const m = p && (p.media || []).find(x => x.id === id);
    if (m && isFinite(v.duration)) { m.duration = v.duration; save(pid); }
    try { v.currentTime = Math.min(1, (v.duration || 2) / 3); } catch (e) {}
  };
  v.onseeked = () => {
    try {
      const cv = document.createElement("canvas"); const w = 240, h = Math.round(240 * (v.videoHeight || 9) / (v.videoWidth || 16));
      cv.width = w; cv.height = h; cv.getContext("2d").drawImage(v, 0, 0, w, h);
      const p = S.docs[pid]; const m = p && (p.media || []).find(x => x.id === id);
      if (m) { m.thumb = cv.toDataURL("image/jpeg", 0.6); save(pid); }
      if (S.view === "project" && S.tab === "media" && !S.sheet) render();
    } catch (e) {}
  };
}
function buildPkg(p) {
  const a = analyze(p);
  return "# " + (p.title || p.name) + "\n\n" +
    "Tema: " + (p.topic || "-") + "\nNarración: " + (p.voice === "ia" ? "voz IA" : "voz propia") + "\nOriginalidad: " + (a.score != null ? a.score + "/100 (" + LVL[a.level] + ")" : "sin revisar") + "\n" +
    (p.synthetic ? "Declarar en YouTube Studio: Contenido alterado o sintético\n" : "") +
    "\n## Guión\n\n" + (p.script || "") + "\n\n## Descripción\n\n" + (p.description || "") + "\n\n## Etiquetas\n\n" + (p.tagsText || "") +
    "\n\n## Miniatura\n\n" + [(p.thumb || {}).l1, (p.thumb || {}).l2].filter(Boolean).join(" / ") +
    "\n\n## Audios\n\n" + ((p.takes || []).map(t => "- " + t.name + (t.dur ? " (" + fmtDur(t.dur) + ")" : "")).join("\n") || "-") + "\n";
}

/* ---------- acciones ---------- */
async function act(name, el) {
  const p = cur(); const d = el.dataset;
  switch (name) {
    case "new": {
      const id = uid(); S.docs[id] = newProject(); save(id, 100);

      const ta = $("#f-script"); if (ta) ta.focus(); break;

    case "open": S.pid = d.id; S.view = "project"; S.tab = "guion"; render(); window.scrollTo(0, 0); break;
    case "home": Player.stop(); listAudio.pause(); listPlaying = null; S.view = "home"; S.sheet = null; render(); window.scrollTo(0, 0); break;
    case "settings": S.view = "settings"; S.sheet = null; render(); window.scrollTo(0, 0); if (S.status === undefined) loadStatus().then(render); break;

    case "forgetClone": { const s = settings(); if (s.clone && s.voiceId === s.clone.id) { s.voiceId = ""; s.voiceName = ""; } delete s.clone; save("settings"); render(); break; }
    case "install": if (S.installEvt) { S.installEvt.prompt(); try { await S.installEvt.userChoice; } catch (e) {} S.installEvt = null; render(); } break;
    case "backup": {
      const data = JSON.stringify({ app: "vidcreator", version: 1, exportedAt: new Date().toISOString(), docs: S.docs }, null, 2);

    }

    case "menu": S.sheet = { type: "menu" }; renderSheet(); break;
    case "closeSheet": Player.stop(); if (S.rec && !S.rec.mr) S.rec = null; S.sheet = null; S.ed = null; S.au = null; renderSheet(); render(); break;

      const id = uid(); const copy = JSON.parse(JSON.stringify(p)); delete copy.id;

      S.docs[id] = copy; save(id, 50); S.pid = id; S.sheet = null; render(); toast("Video duplicado (sin fotos ni audios)"); break;
    }
    case "askDel": S.sheet = { type: "confirmDel" }; renderSheet(); break;
    case "del": {
      const id = p.id; clearTimeout(timers.get(id)); timers.delete(id);
      const blobIds = (p.media || []).map(m => m.id).concat((p.takes || []).map(t => t.id));
      delete S.docs[id]; S.sheet = null; S.view = "home"; render();
      try { await DB.del("docs", id); for (const b of blobIds) await DB.del("blobs", b); toast("Video eliminado"); } catch (e) { toast("No se pudo eliminar por completo."); }
      break;
    }
    case "voice": p.voice = d.v; touch(p); save(p.id); render(); break;
    case "fix": {
      if (!(p.script || "").trim()) { toast("Escribe tu guión primero."); break; }
      const r = await askJSON("fix", "Revisando tu guión", promptFix(p));
      if (r && typeof r.guion === "string" && r.guion.trim()) { S.suggest[p.id] = { guion: r.guion.trim(), cambios: Array.isArray(r.cambios) ? r.cambios.slice(0, 8).map(String) : [] }; render(); }
      else if (r) toast("La respuesta no trajo un guión. Toca de nuevo.");
      break;
    }
    case "applyFix": { const s = S.suggest[p.id]; if (!s) break; p.scriptPrev = p.script; p.script = s.guion; p.corrected = true; delete S.suggest[p.id]; touch(p); save(p.id); render(); toast("Corrección aplicada"); break; }
    case "dropFix": delete S.suggest[p.id]; render(); break;

    case "recOpen": listAudio.pause(); listPlaying = null; S.rec = { speed: 28, scroll: true, acc: 0 }; S.sheet = { type: "rec" }; renderSheet(); break;
    case "recStart": recStart(); break;
    case "recPause": recPause(); break;
    case "recStop": recStop(false); break;
    case "recCancel": recStop(true); break;
    case "audUpload": $("#fileAudio").click(); break;
    case "tplay": {
      const t = S.takes[d.id]; if (!t) break;

    case "auPlay": { const st = S.au; if (!st) break; if (Player.src) Player.stop(); else Player.play(st.x, st.a, st.b, () => renderSheet()); renderSheet(); break; }
    case "auAll": { const st = S.au; st.a = 0; st.b = AU.dur(st.x); renderSheet(); break; }
    case "auTrim": { const st = S.au; if (st.b - st.a < 0.2) { toast("La selección es muy corta."); break; } const a = st.a, b = st.b; auApply(x => AU.slice(x, a, b), "Recortado"); break; }
    case "auCut": { const st = S.au; if (st.b - st.a < 0.05) { toast("Selecciona la parte a borrar."); break; } if (st.a <= 0.01 && st.b >= AU.dur(st.x) - 0.01) { toast("Selecciona solo la parte a borrar, no todo."); break; } const a = st.a, b = st.b; auApply(x => AU.cut(x, a, b), "Parte borrada"); break; }

    case "auClean": auApply(x => AU.normalize(AU.gate(AU.highpass(x, 80))), "Ruido reducido"); break;
    case "auNorm": auApply(x => AU.normalize(x), "Volumen nivelado"); break;
    case "auSpeed": { const f = S.au.speed / 100; auApply(x => AU.speed(x, f), "Velocidad aplicada"); S.au.speed = 100; renderSheet(); break; }
    case "auUndo": { const st = S.au; if (!st.undo.length) break; Player.stop(); st.x = st.undo.pop(); st.a = 0; st.b = AU.dur(st.x); renderSheet(); break; }
    case "auSave": { const st = S.au; const blob = AU.wav(st.x); await addTake(p, blob, "editada", takeName(p, "editada"), AU.dur(st.x)); Player.stop(); S.sheet = null; S.au = null; renderSheet(); render(); toast("Guardada como nueva toma"); break; }
    case "auWav": { const st = S.au; const t = (p.takes || []).find(x => x.id === st.takeId); saveFile(slug((p.title || p.name) + "-" + (t ? t.name : "audio")) + ".wav", AU.wav(st.x)); break; }
    case "auShare": { const st = S.au; const t = (p.takes || []).find(x => x.id === st.takeId); await shareFile(slug((p.title || p.name) + "-" + (t ? t.name : "audio")) + ".wav", AU.wav(st.x)); break; }
    case "auDelete": {
      const st = S.au; Player.stop();
      p.takes = (p.takes || []).filter(x => x.id !== st.takeId); DB.del("blobs", st.takeId).catch(() => {}); delete S.takes[st.takeId];

    }
    case "loadVoices": loadVoices(); break;
    case "pickVoice": { const s = settings(); s.voiceId = d.id; s.voiceName = d.name; save("settings"); render(); break; }
    case "vprev": listAudio.src = d.url; listAudio.play().catch(() => {}); break;
    case "ttsPart": S.ttsPart = d.v; render(); break;
    case "genTTS": genTTS(p); break;
    case "consent": S.cloneConsent = !S.cloneConsent; el.classList.toggle("on", S.cloneConsent); break;
    case "clone": cloneVoice(p); break;

    /* fotos y videos */
    case "upload": $("#fileMedia").click(); break;
    case "thumbUpload": $("#fileThumb").click(); break;
    case "openMedia": S.ed = null; S.sheet = { type: "media", mid: d.mid }; renderSheet(); break;
    case "origin": { const m = (p.media || []).find(x => x.id === d.mid); if (!m) break; m.origin = { propio: "stock", stock: "ia", ia: "propio" }[m.origin] || "propio"; touch(p); save(p.id); render(); break; }
    case "rmMedia": { p.media = (p.media || []).filter(x => x.id !== d.mid); if (p.thumb && p.thumb.bgId === d.mid) p.thumb.bgId = ""; DB.del("blobs", d.mid).catch(() => {}); touch(p); save(p.id); S.sheet = null; S.ed = null; render(); break; }

          falta: Array.isArray(r.falta) ? r.falta.slice(0, 4).map(String) : [], fortalezas: Array.isArray(r.fortalezas) ? r.fortalezas.slice(0, 3).map(String) : [] };
        touch(p); save(p.id); render();

    case "synthetic": p.synthetic = !p.synthetic; touch(p); save(p.id); render(); break;
    case "genDesc": {
      if (!(p.script || "").trim()) { toast("Escribe tu guión primero."); break; }

    case "pkg": saveFile(slug(p.title || p.name) + ".md", new Blob([buildPkg(p)], { type: "text/markdown" })); break;
  }
}

document.addEventListener("click", e => {
  const tele = e.target.closest("#tele");
  if (tele && S.rec) { S.rec.scroll = !S.rec.scroll; return; }
  const wave = e.target.closest("#wave");
  if (wave && S.au) {
    const r = wave.getBoundingClientRect(); const t = (e.clientX - r.left) / r.width * AU.dur(S.au.x);
    if (Math.abs(t - S.au.a) < Math.abs(t - S.au.b)) S.au.a = clamp(t, 0, S.au.b - 0.01); else S.au.b = clamp(t, S.au.a + 0.01, AU.dur(S.au.x));
    Player.stop(); renderSheet(); return;
  }
  const el = e.target.closest("[data-act]");
  if (!el || el.disabled) return;
  if (el.tagName === "A") return;
  e.preventDefault(); e.stopPropagation();
  act(el.dataset.act, el);
});

let bannerT;
document.addEventListener("input", e => {
  const el = e.target;
  if (el.id === "teleSpeed" && S.rec) { S.rec.speed = +el.value; const s = el.parentElement.querySelector(".mono"); if (s) s.textContent = el.value; return; }
  if (el.dataset.au && S.au) {
    const st = S.au, v = +el.value;
    if (el.dataset.au === "a") st.a = Math.min(v, st.b - 0.01);
    else if (el.dataset.au === "b") st.b = Math.max(v, st.a + 0.01);
    else { st.speed = v; const s = $("#au-spv"); if (s) s.textContent = v + "%"; const b = document.querySelector('[data-act="auSpeed"]'); if (b) b.disabled = v === 100; return; }
    const av = $("#au-av"), bv = $("#au-bv"); if (av) av.textContent = fmtSec(st.a); if (bv) bv.textContent = fmtSec(st.b);
    drawWave(); return;
  }
  if (el.dataset.ed && S.ed) {
    S.ed[el.dataset.ed] = +el.value;
    const v = $("#edv-" + el.dataset.ed); if (v) v.textContent = el.value + "%";
    const im = $("#edImg"); if (im) im.style.filter = edFilter(S.ed);
    return;
  }
  const f = el.dataset.field; if (!f) return;
  const p = cur(); if (!p) return;
  if (f.startsWith("thumb.")) { p.thumb[f.slice(6)] = f === "thumb.dark" ? +el.value : el.value; drawThumb(); const c = $("#l1c"); if (c) c.textContent = wordsOf(p.thumb.l1) + " / 4 palabras"; }
  else p[f] = el.value;
  touch(p); save(p.id, 700);
  if (f === "script") {
    const w = $("#wc"); if (w) w.textContent = wcLabel(p);
    clearTimeout(bannerT);
    bannerT = setTimeout(() => {
      const slot = $("#alertSlot"); const pp = cur(); if (!slot || !pp) return;
      const a = analyze(pp); slot.innerHTML = banner(pp, a);
      document.querySelectorAll('.tab[data-t="orig"] .dot').forEach(dd => { dd.className = "dot " + a.level; });
    }, 500);
  }
  if (f === "title") {
    const len = el.value.length; const t = $("#tlen"); if (t) t.textContent = len + " / 100";
    const m = $("#tmeter"); if (m) { m.style.width = Math.min(100, len) + "%"; m.style.background = len === 0 ? "var(--line)" : len <= 60 ? "var(--ok)" : len <= 80 ? "var(--warn)" : "var(--bad)"; }
  }
});

$("#fileMedia").addEventListener("change", async e => { const fs = [...e.target.files]; e.target.value = ""; if (fs.length) { await addFiles(fs); render(); } });
$("#fileThumb").addEventListener("change", async e => {
  const fs = [...e.target.files]; e.target.value = ""; if (!fs.length) return;
  const p = cur(); const [nid] = await addFiles(fs.slice(0, 1)); if (p && nid) { p.thumb.bgId = nid; save(p.id); } render();
});
$("#fileAudio").addEventListener("change", async e => {
  const f = e.target.files[0]; e.target.value = ""; const p = cur(); if (!f || !p) return;
  try { const x = await decodeBlob(f); await addTake(p, AU.wav(x), "grabacion", f.name.replace(/\.[^.]+$/, "").slice(0, 60) || takeName(p, "grabacion"), AU.dur(x)); render(); toast("Audio agregado"); }
  catch (err) { toast("No se pudo leer ese archivo de audio."); }
});
$("#fileBackup").addEventListener("change", async e => {
  const f = e.target.files[0]; e.target.value = ""; if (!f) return;
  try {
    const j = JSON.parse(await f.text()); if (!j || j.app !== "vidcreator" || !j.docs) throw new Error("x");
    let n = 0;
    for (const [id, doc] of Object.entries(j.docs)) { if (doc && doc.kind === "project" && !S.docs[id]) { S.docs[id] = doc; save(id, 50); n++; } }
    render(); toast(n ? n + " video(s) restaurados" : "No había videos nuevos en el respaldo.");
  } catch (err) { toast("Ese archivo no es un respaldo de VidCreator."); }
});

window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); S.installEvt = e; if (S.view !== "project") render(); });
window.addEventListener("resize", () => drawWave());
window.addEventListener("online", () => { loadStatus().then(() => { if (!isTyping()) render(); }); });

/* ---------- arranque ---------- */
(async function boot() {
  await DB.open();
  const docs = await DB.all("docs").catch(() => ({}));
  S.docs = docs || {};
  S.loaded = true;
  if (!Object.keys(S.docs).length) seed();
  render();
  loadStatus().then(() => { if (!isTyping() && !S.sheet) render(); });
  if (document.fonts && document.fonts.load) document.fonts.load("100px Anton").then(() => drawThumb()).catch(() => {});
  if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("/sw.js").catch(() => {});
})();
</script>
</body>
